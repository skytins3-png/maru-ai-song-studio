name: MARU automatic weather and verified news radio
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_radio_daily.py'
      - '.github/workflows/radio-daily-update.yml'
permissions:
  contents: write
concurrency:
  group: maru-daily-weather-and-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current Open-Meteo data and source-dated BBC headlines
        run: python scripts/update_radio_daily.py
      - name: Commit only verified daily facts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-share/broadcast-daily.json
          if git diff --cached --quiet; then
            echo "No verified updates to publish"
          else
            git commit -m "radio: auto-refresh cited weather and news"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
