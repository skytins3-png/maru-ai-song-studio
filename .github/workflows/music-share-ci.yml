name: MUSIC SHARE website and story submission tests
on:
  push:
    paths:
      - 'music-share/**'
      - 'tests/music-share.test.cjs'
      - 'tests/music-share-stories.test.cjs'
      - 'tests/music-share-radio.test.cjs'
      - 'tests/music-share-radio-local.test.cjs'
      - 'tests/music-share-batch.test.cjs'
      - 'tests/music-share-security.test.cjs'
      - 'tests/music-share-daily.test.cjs'
      - 'tests/music-share-scheduling.test.cjs'
      - 'scripts/update_radio_daily.py'
      - 'scripts/test_radio_daily.py'
      - 'scripts/radio-story-moderator.cjs'
      - '.github/workflows/music-share-ci.yml'
  pull_request:
    paths:
      - 'music-share/**'
      - 'tests/music-share.test.cjs'
      - 'tests/music-share-stories.test.cjs'
      - 'tests/music-share-radio.test.cjs'
      - 'tests/music-share-radio-local.test.cjs'
      - 'tests/music-share-batch.test.cjs'
      - 'tests/music-share-security.test.cjs'
      - 'tests/music-share-daily.test.cjs'
      - 'tests/music-share-scheduling.test.cjs'
      - 'scripts/update_radio_daily.py'
      - 'scripts/test_radio_daily.py'
      - 'scripts/radio-story-moderator.cjs'
      - '.github/workflows/music-share-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test existing uploads, downloads, privacy filters and public stories
        run: node --test tests/music-share.test.cjs tests/music-share-stories.test.cjs tests/music-share-radio.test.cjs tests/music-share-batch.test.cjs tests/music-share-radio-local.test.cjs tests/music-share-security.test.cjs tests/music-share-daily.test.cjs tests/music-share-scheduling.test.cjs
      - name: Verify Open-Meteo and BBC feed parsing with offline fixtures
        run: python3 scripts/test_radio_daily.py
