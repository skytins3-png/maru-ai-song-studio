name: Broadcast fixed sidebar UI checks
on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'sw.js'
      - 'tests/broadcast-fixed-sidebar.test.cjs'
      - '.github/workflows/broadcast-sidebar-ci.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'sw.js'
      - 'tests/broadcast-fixed-sidebar.test.cjs'
      - '.github/workflows/broadcast-sidebar-ci.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Fixed sidebar and media link tests
        run: node --test tests/broadcast-fixed-sidebar.test.cjs
