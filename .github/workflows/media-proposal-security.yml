name: MARU media proposal public-text screening
on:
  issues:
    types: [opened, edited, reopened, closed]
permissions:
  contents: read
  issues: write
concurrency:
  group: maru-media-proposal-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  screen:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout reviewed main code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare media TEXT review labels (not antivirus or rights approval)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in media-screened media-quarantine; do
            if gh api "repos/$GITHUB_REPOSITORY/labels/$name" >/dev/null 2>&1; then
              continue
            fi
            if [ "$name" = "media-screened" ]; then
              color='4B83A8'
              note='Public form text screened only; NOT file antivirus or copyright approval'
            else
              color='B85454'
              note='Media request unsafe or malformed; NOT for broadcast'
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
              -f name="$name" -f color="$color" -f description="$note" >/dev/null \
              || gh api "repos/$GITHUB_REPOSITORY/labels/$name" >/dev/null
          done
      - name: Screen public proposal metadata only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/media-proposal-moderator.cjs
