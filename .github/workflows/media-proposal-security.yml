name: MARU media proposal public-text screening
on:
  issues:
    types: [opened, edited, reopened, closed]
permissions:
  contents: read
  issues: write
concurrency:
  group: maru-media-proposal-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  screen:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout reviewed main code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Screen public proposal metadata only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/media-proposal-moderator.cjs
